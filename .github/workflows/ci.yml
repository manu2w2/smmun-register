name: CI

on:
  pull_request:
    branches: [dev, stage, main]
  push:
    branches: [dev, stage, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify promotion path
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.base_ref }}
          PR_HEAD: ${{ github.head_ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          case "$PR_BASE" in
            stage) source=dev ;;
            main) source=stage ;;
            *) exit 0 ;;
          esac
          if [ "$PR_HEAD_REPO" != "$REPO" ] || [ "$PR_HEAD" != "$source" ]; then
            echo "::error::La rama $PR_BASE recibe promociones desde $source en este repositorio."
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Start local Supabase
        run: npm run db:start >/dev/null
      - name: Verify local PostgreSQL
        run: npm run db:check
      - name: Stop local Supabase
        if: always()
        run: |
          if [ -x node_modules/.bin/supabase ]; then
            npm run db:stop
          fi
